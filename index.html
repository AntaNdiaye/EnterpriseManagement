<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(22, 28, 41, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #e6ab43;
            --accent-gold-hover: #f3b953;
            --accent-glow: rgba(230, 171, 67, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 171, 67, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(230, 171, 67, 0.4);
            border-radius: 30px;
            padding: 6px 14px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .logo-text {
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
        }

        .header-title {
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
        }

        main {
            padding: 24px;
        }

        .main-title {
            color: var(--text-primary);
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .table-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(230, 171, 67, 0.1);
            color: var(--accent-gold);
            padding: 12px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.85rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .month-cell {
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 14px;
        }

        td input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 6px 8px;
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }

        td input:focus {
            background: rgba(230, 171, 67, 0.05);
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .progress-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .goal-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-title {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .goal-input {
            width: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--accent-gold);
            padding: 4px 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .progress-percentage {
            color: var(--accent-gold);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c8933f, var(--accent-gold-hover));
            border-radius: 20px;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.4s ease;
        }

        .stats-summary {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: -4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo-container">
            <div class="logo-badge">
                <span class="logo-text">DEGG DADJ DRIP</span>
            </div>
            <span class="header-title">Enterprise Management</span>
        </div>
    </header>

    <main>
        <h1 class="main-title">Revenus Mensuels Par Personne</h1>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Mois</th>
                        <th>Anta</th>
                        <th>Djibril</th>
                        <th>DDD</th>
                    </tr>
                </thead>
                <tbody id="revenueBody"></tbody>
            </table>
        </div>

        <div class="actions">
            <button class="clear-btn" onclick="clearSavedData()">Effacer les données</button>
        </div>

        <div class="progress-card">
            <div class="progress-header">
                <div class="goal-container">
                    <span class="progress-title">DDD2 Objectif:</span>
                    <input 
                        type="number" 
                        id="goalInput" 
                        class="goal-input" 
                        placeholder="10000" 
                        oninput="updateProgress()"
                    />
                </div>
                <span class="progress-percentage" id="progressText">0%</span>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="stats-summary" id="statsSummary">Total DDD: 0</div>
        </div>
    </main>
</div>

<script>
    const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août","Septembre","Octobre","Novembre","Décembre"];
    const personKeys = ["anta", "djibril", "ddd"];
    const tbody = document.getElementById('revenueBody');
    const goalInput = document.getElementById('goalInput');

    // Restore target goal or set default
    const savedGoal = localStorage.getItem('ddd2_goal') || '10000';
    goalInput.value = savedGoal;

    // Generate table rows
    months.forEach((month, rowIndex) => {
        const row = document.createElement('tr');
        let rowHtml = `<td class="month-cell">${month}</td>`;
        
        personKeys.forEach(person => {
            const storageKey = `revenue_${rowIndex}_${person}`;
            const savedValue = localStorage.getItem(storageKey) || '';

            rowHtml += `
                <td>
                    <input 
                        type="number" 
                        class="${person === 'ddd' ? 'ddd-input' : ''}"
                        placeholder="0" 
                        value="${savedValue}" 
                        oninput="saveValue('${storageKey}', this.value); updateProgress();"
                    />
                </td>
            `;
        });

        row.innerHTML = rowHtml;
        tbody.appendChild(row);
    });

    // Save individual values to storage
    function saveValue(key, value) {
        localStorage.setItem(key, value);
    }

    // Dynamic Calculation Logic
    function updateProgress() {
        const dddInputs = document.querySelectorAll('.ddd-input');
        let totalDDD = 0;

        // Sum all entries in the DDD column
        dddInputs.forEach(input => {
            const val = parseFloat(input.value);
            if (!isNaN(val)) {
                totalDDD += val;
            }
        });

        // Get target goal
        const goal = parseFloat(goalInput.value) || 0;
        localStorage.setItem('ddd2_goal', goalInput.value);

        // Calculate progress percentage
        let percentage = 0;
        if (goal > 0) {
            percentage = Math.round((totalDDD / goal) * 100);
        }

        // Cap bar visually at 100% while allowing percentage label to grow
        const visualPercentage = Math.min(percentage, 100);

        // Update DOM
        document.getElementById('progressBar').style.width = visualPercentage + '%';
        document.getElementById('progressText').textContent = percentage + '%';
        document.getElementById('statsSummary').textContent = `Total DDD: ${totalDDD.toLocaleString()} / ${goal.toLocaleString()}`;
    }

    function clearSavedData() {
        if (confirm("Voulez-vous vraiment effacer toutes les données enregistrées ?")) {
            months.forEach((_, rowIndex) => {
                personKeys.forEach(person => {
                    localStorage.removeItem(`revenue_${rowIndex}_${person}`);
                });
            });
            localStorage.removeItem('ddd2_goal');
            location.reload();
        }
    }

    // Initial calculation on load
    updateProgress();
</script>

</body>
</html>
